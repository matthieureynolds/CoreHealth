version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: corehealth
      POSTGRES_USER: corehealth_admin
      POSTGRES_PASSWORD: localdev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corehealth_admin -d corehealth']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
